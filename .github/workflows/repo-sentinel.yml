name: RepoSentinel Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build RepoSentinel
        run: npm run build

      # Keep artifacts even when the recommendation is needs_changes or inconclusive.
      - name: Run RepoSentinel
        continue-on-error: true
        env:
          PI_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          PI_HEAD_REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: >-
          node dist/cli.js review
          --repo .
          --base "$PI_BASE_REF"
          --head "$PI_HEAD_REF"
          --output .repo-sentinel/ci-run

      - name: Upload RepoSentinel artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repo-sentinel-report
          path: .repo-sentinel/ci-run/
          if-no-files-found: warn
